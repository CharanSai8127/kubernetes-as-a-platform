apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/example/platform-repository.git
    targetRevision: main
    path: platform-applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Example App-of-Apps Pattern

# Demonstrates:
# - centralized reconciliation visibility
# - operational aggregation
# - platform coordination
# - infrastructure organization
# - centralized operational management
