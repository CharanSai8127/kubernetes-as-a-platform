apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: migration:v1
          command:
            - ./migrate.sh
---
# Example Sync Phase Job

# Demonstrates:
# - migration coordination
# - dependency sequencing
# - PreSync reconciliation hooks
# - operational correctness
# - API dependency safety
