apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  replicas: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: backend:v2

          ports:
            - containerPort: 8080
