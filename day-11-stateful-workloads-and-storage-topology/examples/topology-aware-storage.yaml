apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: topology-aware-storage

provisioner: ebs.csi.aws.com

volumeBindingMode: WaitForFirstConsumer

allowedTopologies:
  - matchLabelExpressions:
      - key: topology.kubernetes.io/zone
        values:
          - us-east-1a
          - us-east-1b

parameters:
  type: gp3
