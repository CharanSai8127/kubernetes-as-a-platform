apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kubernetes-dashboard.json: |
    {
      "title": "Kubernetes Operational Visibility",
      "panels": [
        {
          "type": "graph",
          "title": "CPU Usage"
        },
        {
          "type": "graph",
          "title": "Memory Usage"
        }
      ]
    }
