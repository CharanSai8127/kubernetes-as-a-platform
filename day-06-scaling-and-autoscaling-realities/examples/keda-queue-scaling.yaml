apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queue-workers
spec:
  scaleTargetRef:
    name: queue-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 25
  triggers:
  - type: rabbitmq
    metadata:
      queueName: jobs
      mode: QueueLength
      value: "50"
